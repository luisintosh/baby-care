name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The database and the push function go first: the new site may write event
  # kinds or columns that only exist after this job's migrations.
  supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Supabase settings
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (a Supabase personal access token)."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Add the SUPABASE_PROJECT_ID repository variable (the project ref)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      # The access token alone is enough: the CLI connects through a temporary
      # login role, so no database password is stored in GitHub.
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply migrations
        run: supabase db push

      # feed-reminder imports src/lib/feed-schedule.ts and format.ts, so app
      # changes can change push copy. Redeploying every time keeps it in step.
      # verify_jwt = false comes from supabase/config.toml (pg_cron has no JWT).
      - name: Deploy feed-reminder
        run: supabase functions deploy feed-reminder --project-ref "$SUPABASE_PROJECT_ID"

  build:
    needs: supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      - name: Check the service worker was stamped
        run: |
          if grep -q "__BUILD_ID__" dist/sw.js; then
            echo "::error::dist/sw.js still has the __BUILD_ID__ placeholder"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
